[package]
name = "percyscarlett"
version = "0.2.1"
edition = "2021"
license-file = "LICENSE"
description = "Clean-room Rust Xbox Series X|S (Scarlett) bring-up & translation layer for Windows 10/11"

[workspace]
members = [
    "crates/xmem",
    "crates/d3d12_xs",
    "crates/winrt_xs",
    "crates/xgameruntime",
    "crates/dstorage",
    "crates/gameinput",
    "crates/kernelx",
    "crates/xg_xs",
    "crates/xaudio2_9",
]

[dependencies]
flate2 = "1"
d3d12_xs = { path = "crates/d3d12_xs" }
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "percyscarlett"
path = "src/main.rs"
