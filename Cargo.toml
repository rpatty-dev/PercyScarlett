[package]
name = "percyscarlett"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Clean-room Rust Xbox Series X|S (Scarlett) bring-up & translation layer for Windows 10/11"

[workspace]
members = [
    "crates/xmem",
    "crates/d3d12_xs",
    "crates/winrt_xs",
    "crates/xgameruntime",
    "crates/dstorage",
    "crates/gameinput",
    "crates/kernelx",
    "crates/xg_xs",
    "crates/xaudio2_9",
    "crates/acphal",
    "crates/xapu",
    "crates/xcurl",
]

[dependencies]
flate2 = "1"
d3d12_xs = { path = "crates/d3d12_xs" }
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[[bin]]
name = "percyscarlett"
path = "src/main.rs"

[profile.release]
debug = "line-tables-only"

